name: build

on:
  workflow_dispatch:
  
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      # ccache 配置
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
      # pip 缓存目录
      PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache
    steps:
      - name: checkout
        uses: actions/checkout@v4
      
      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: pip-${{ runner.os }}-cache
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-cache
          restore-keys: |
            apt-${{ runner.os }}-
        
      - name: Install dependencies
        shell: bash
        run: |
          sudo apt install -y \
            libunwind-dev \
            build-essential cmake python3 python3-venv ninja-build \
            libsdl2-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libx11-dev \
            libdrm-dev libgbm-dev \
            libpng-dev \
            libevdev-dev \
            libwebp-dev \
            libfreetype6-dev \
            libegl-dev libgles-dev libgl-dev
          sudo apt install -y libavcodec-dev libavformat-dev libavutil-dev libswscale-dev
          sudo apt install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install the Python tools in a virtual
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install kconfiglib pcpp
          
      - name: Build
        shell: bash
        run: |
          echo "cmake --build build-release -j$(nproc)"
          cmake -DCMAKE_BUILD_TYPE=Release -G Ninja -S . -B build-release
          cmake --build build-release -j$(nproc)
          
      - name: Upload lvglsim
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lvglsim-linux
          path: build-release/bin/lvglsim
          retention-days: 90